name: Verify downloadable Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Fetch and verify the exact public release
        run: |
          curl --fail --location https://aplikasi-vas.vercel.app/downloads/VAS-Android.apk -o VAS-public.apk
          expected=$(python3 -c "import json; print(json.load(open('downloads/android-release.json'))['sha256'])")
          echo "$expected  VAS-public.apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs VAS-public.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch the signed public APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: bash scripts/verify-android-install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-verification-api-${{ matrix.api }}
          path: install-results/
