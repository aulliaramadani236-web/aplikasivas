name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package offline application
        run: node scripts/build-android-assets.mjs
      - name: Prepare release signing
        env:
          KEYSTORE: ${{ secrets.VAS_ANDROID_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/vas-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          VAS_KEYSTORE_PATH: ${{ runner.temp }}/vas-release.jks
          VAS_KEYSTORE_PASSWORD: ${{ secrets.VAS_ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VAS-Android
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          working-directory: android
          script: gradle :app:connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: android/app/build/reports/androidTests
