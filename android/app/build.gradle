plugins { id 'com.android.application' }
android {
    namespace 'id.vas.umkm'
    compileSdk 35
    defaultConfig {
        applicationId 'id.vas.umkm'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('VAS_KEYSTORE_PATH') ?: 'release.jks')
            storePassword System.getenv('VAS_KEYSTORE_PASSWORD')
            keyAlias 'vas'
            keyPassword System.getenv('VAS_KEYSTORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
